# Builds a universal macOS Valkey, uploads it as a GitHub release asset, adds it to the signed
# registry (registry/registry.json) that Valkey.app installs versions from, and redeploys valkey.app.
# Needs the VALKEY_REGISTRY_PRIVATE_KEY repository secret (see registry/scripts/registry.swift keygen).
name: Publish Valkey version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Valkey version to publish (e.g. 9.1.2)
        required: true

concurrency: registry

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      ASSET: valkey-${{ inputs.version }}-macos-universal.tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: Build and package
        run: registry/scripts/package-valkey.sh "$VERSION"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="valkey-$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "Valkey $VERSION" \
              --notes "Universal macOS build of Valkey $VERSION for Valkey.app."
          gh release upload "$TAG" "registry/dist/$ASSET" --clobber

      - name: Add to registry and sign
        env:
          VALKEY_REGISTRY_PRIVATE_KEY: ${{ secrets.VALKEY_REGISTRY_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://github.com/$REPO/releases/download/valkey-$VERSION/$ASSET"
          TOOL=registry/scripts/registry.swift
          swift $TOOL add registry/registry.json "$VERSION" "$URL" "registry/dist/$ASSET"
          swift $TOOL sign registry/registry.json
          swift $TOOL verify registry/registry.json \
            "$(grep -o 'releaseKey = "[^"]*"' app/Valkey/VersionStore.swift | cut -d'"' -f2)"

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/registry.json registry/registry.json.sig
          git commit -m "Registry: publish Valkey $VERSION"
          git push

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
