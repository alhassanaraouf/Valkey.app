# Builds a Valkey module (universal), tests every build against each Valkey line it will be listed for,
# uploads the builds to a GitHub release, adds them to the signed registry and redeploys valkey.app.
# Needs the VALKEY_REGISTRY_PRIVATE_KEY repository secret.
name: Publish module

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to publish
        type: choice
        options: [json, bloom]
      version:
        description: Module version (its release tag, e.g. 1.0.3)
        required: true

concurrency: registry

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MODULE: ${{ inputs.module }}
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet cmake ninja
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build, test and package
        run: registry/scripts/package-module.sh "$MODULE" "$VERSION"

      - name: Upload release assets
        run: |
          TAG="module-$MODULE-$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "Valkey $MODULE module $VERSION" --latest=false \
              --notes "Universal macOS builds of the Valkey $MODULE module $VERSION for Valkey.app."
          gh release upload "$TAG" registry/dist/modules/*.tar.gz --clobber

      - name: Add to registry and sign
        env:
          VALKEY_REGISTRY_PRIVATE_KEY: ${{ secrets.VALKEY_REGISTRY_PRIVATE_KEY }}
        run: |
          TOOL=registry/scripts/registry.swift
          for meta in registry/dist/modules/*.json; do
            id=$(basename "$meta" .json)
            swift $TOOL add-module registry/registry.json "$meta" \
              "https://github.com/$REPO/releases/download/module-$MODULE-$VERSION/$id.tar.gz" \
              "registry/dist/modules/$id.tar.gz"
          done
          swift $TOOL sign registry/registry.json
          swift $TOOL verify registry/registry.json \
            "$(grep -o 'releaseKey = "[^"]*"' app/Valkey/VersionStore.swift | cut -d'"' -f2)"

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/registry.json registry/registry.json.sig
          git commit -m "Registry: publish $MODULE module $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-website.yml
