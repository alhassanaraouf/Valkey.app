# TEMPORARY (drop before merging): reruns valkey-search's time_sliced_mrmw_mutex_test on macOS without
# ctest's 60 s limit, to tell "slow on a 3-core runner" from "hangs". Separate file so pushing it
# doesn't restart module-spike.yml's 2 h build.
name: Module spike (mutex test)

on:
  push:
    branches: [modules/bloom-92-and-search]
    paths: [.github/workflows/module-spike-mutex.yml]

permissions:
  contents: read

jobs:
  mutex-test:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v5
      - name: Build and run time_sliced_mrmw_mutex_test (twice, no ctest limit)
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet cmake ninja
          export PATH="$RUNNER_TEMP/tools/bin:$(tr ':' '\n' <<<"$PATH" | grep -vE '^(/opt/homebrew|/usr/local)' | paste -sd: -)"
          export CMAKE_TOOLCHAIN_FILE=$PWD/registry/scripts/hermetic.cmake
          git clone -q -c advice.detachedHead=false --depth 1 --branch 1.3.0 https://github.com/valkey-io/valkey-search.git vs
          cd vs
          sed -i '' 's/-DgRPC_SSL_PROVIDER=package/-DgRPC_SSL_PROVIDER=module/' submodules/CMakeLists.txt
          perl -0pi -e 's/std::to_chars\(storage, storage \+ sizeof\(storage\), d,\s*std::chars_format::fixed, 0\)/std::to_chars_result{storage + snprintf(storage, sizeof(storage), "%.0f", d), std::errc()}/' src/expr/value.cc
          ./build.sh > ../build.log 2>&1 || { tail -40 ../build.log; exit 1; }
          for i in 1 2; do
            start=$(date +%s)
            perl -e 'alarm 900; exec @ARGV' .build-release/tests/time_sliced_mrmw_mutex_test | grep -E '^\[ +(OK|FAILED|PASSED) |^\[==========\]'
            echo "run $i: exit ${PIPESTATUS[0]}, $(( $(date +%s) - start )) s"
          done
