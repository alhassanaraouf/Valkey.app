# valkey.app is deployed by Cloudflare Workers Builds (Git integration) on every push to main:
#   build command: ./scripts/build-site.sh   deploy command: npx wrangler deploy   (config: wrangler.jsonc)
# This workflow only checks that the site builds; it needs no Cloudflare secrets.
# It is still called by publish-module, publish-valkey and release-app after registry commits.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - registry/registry.json
      - registry/registry.json.sig
      - scripts/build-site.sh
      - wrangler.jsonc
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Always main: when called right after a registry commit, the triggering SHA predates it.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Build site (check only; Cloudflare Workers Builds deploys)
        run: |
          ./scripts/build-site.sh
          for f in _redirects index.html install-valkey-on-mac/index.html appcast.xml registry.json registry.json.sig sitemap.xml _headers; do
            test -s "_site/$f" || { echo "missing _site/$f"; exit 1; }
          done
