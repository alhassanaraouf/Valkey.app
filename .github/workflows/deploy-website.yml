# Publishes valkey.app on Cloudflare (Workers static assets, see wrangler.jsonc):
# website/ plus registry/registry.json(.sig) at the site root.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Callers must pass `secrets: inherit`.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - registry/registry.json
      - registry/registry.json.sig
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Always main: when called right after a registry commit, the triggering SHA predates it.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir _site
          cp -R website/. _site/
          cp registry/registry.json registry/registry.json.sig _site/
          # Versions, modules and FAQ answers as plain HTML (crawlers don't run JavaScript), plus sitemap.xml.
          python3 website/render.py registry/registry.json _site
          rm _site/render.py _site/og-image.svg

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
